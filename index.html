<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Streaming IPTV - Universal Web Player</title>

  <!-- HLS Player Engine -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #0b0f19; color: #ffffff; min-height: 100vh; overflow-x: hidden; }
    .hidden { display: none !important; }

    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-card: #151c2c;
      --bg-input: #0d1322;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    /* PANTALLA LOGIN */
    .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%); padding: 20px; }
    .app-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 24px; padding: 32px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); }
    
    .brand-icon { font-size: 48px; color: var(--primary); margin-bottom: 10px; }
    .brand-title { font-size: 24px; font-weight: 800; color: #fff; }
    .brand-sub { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }

    .method-tabs { display: flex; background: var(--bg-input); padding: 4px; border-radius: 12px; margin-bottom: 20px; gap: 4px; border: 1px solid var(--border-color); }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; font-weight: 700; font-size: 11px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

    .mac-box { background: rgba(99, 102, 241, 0.1); border: 1px dashed var(--primary); border-radius: 12px; padding: 10px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
    .mac-label { font-size: 10px; color: #a5b4fc; font-weight: 800; text-transform: uppercase; }
    .mac-val { font-size: 13px; font-weight: bold; font-family: monospace; }

    .input-group { text-align: left; margin-bottom: 14px; }
    .input-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; }
    .input-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-input); color: #fff; font-size: 13px; outline: none; transition: border 0.2s; }
    .input-group input:focus { border-color: var(--primary); }

    .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); border: none; border-radius: 12px; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .btn-submit:hover { transform: translateY(-2px); }

    .status-box { margin-top: 15px; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 600; text-align: center; word-break: break-word; }
    .status-error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }

    /* DASHBOARD SMARTERS / IBO */
    .dashboard-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%); padding: 30px; }
    .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }

    .grid-smarters { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 24px; flex: 1; max-height: 65vh; }
    .tile-card { border-radius: 24px; padding: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; color: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); transition: transform 0.2s; }
    .tile-card:hover { transform: translateY(-5px); }
    .tile-card i { font-size: 60px; margin-bottom: 18px; }
    .tile-card h2 { font-size: 24px; font-weight: 900; }

    .tile-live { background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); }
    .tile-movies { background: linear-gradient(135deg, #ec4899 0%, #e11d48 100%); }
    .tile-series { background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%); }

    /* PLAYER VIEW */
    .player-view { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #000; position: fixed; top: 0; left: 0; z-index: 9999; }
    .player-nav { padding: 14px 24px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .btn-back { background: #ef4444; border: none; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }

    .content-body { display: flex; flex: 1; overflow: hidden; }
    .sidebar-categories { width: 340px; background: #0f172a; padding: 18px; display: flex; flex-direction: column; border-right: 1px solid #1e293b; }
    .search-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #090d16; color: #fff; margin-bottom: 14px; outline: none; }
    
    .list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .item-card { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; background: rgba(255,255,255,0.03); border: 1px solid transparent; }
    .item-card:hover, .item-card.active { background: var(--primary); border-color: rgba(255,255,255,0.2); }
    .item-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .video-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; }
    video { width: 100%; height: 100%; max-height: 88vh; }
  </style>
</head>
<body>

  <!-- PANTALLA LOGIN UNIVERSAL -->
  <div id="loginScreen" class="login-wrapper">
    <div class="app-card">
      <div class="brand-icon"><i class="fa-solid fa-tv"></i></div>
      <h1 class="brand-title">Don Streaming IPTV</h1>
      <p class="brand-sub">Reproductor Web Multipanel Universal</p>

      <!-- MAC DEL DISPOSITIVO -->
      <div class="mac-box">
        <div>
          <div class="mac-label">Dirección MAC del Dispositivo</div>
          <div id="displayMac" class="mac-val">DS:85:A7:B6:54:9A</div>
        </div>
        <button onclick="copiarMac()" style="background:var(--primary); border:none; color:#fff; padding:6px 12px; border-radius:6px; font-size:10px; font-weight:bold; cursor:pointer;">Copiar</button>
      </div>

      <!-- SELECCIÓN DE MÉTODO -->
      <div class="method-tabs">
        <button id="tabXtream" class="tab-btn active" onclick="switchTab('xtream')">🔑 Xtream Codes</button>
        <button id="tabM3u" class="tab-btn" onclick="switchTab('m3u')">🏷️ URL M3U</button>
        <button id="tabMac" class="tab-btn" onclick="switchTab('mac')">🖥️ Activar MAC</button>
      </div>

      <!-- FORMULARIO 1: XTREAM CODES (CUALQUIER PANEL) -->
      <div id="formXtream">
        <div class="input-group">
          <label>URL del Servidor / Panel (DNS)</label>
          <input type="text" id="xtreamHost" placeholder="Ej: http://mi-panel.com:8080">
        </div>
        <div class="input-group">
          <label>Usuario IPTV</label>
          <input type="text" id="xtreamUser" placeholder="Usuario">
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" id="xtreamPass" placeholder="••••••••">
        </div>
      </div>

      <!-- FORMULARIO 2: CUALQUIER LISTA M3U -->
      <div id="formM3u" class="hidden">
        <div class="input-group">
          <label>URL de la Lista M3U / M3U8</label>
          <input type="text" id="m3uUrl" placeholder="https://mi-servidor.com/get.php?username=...&type=m3u">
        </div>
      </div>

      <!-- FORMULARIO 3: ACTIVAR MAC -->
      <div id="formMac" class="hidden">
        <div class="input-group">
          <label>Nombre del Cliente</label>
          <input type="text" id="clientName" placeholder="Nombre completo">
        </div>
      </div>

      <button id="btnConnect" class="btn-submit" onclick="conectarServidor()">🚀 Cargar Panel IPTV</button>
      <div id="statusMsg" class="status-box hidden"></div>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="dashScreen" class="dashboard-container hidden">
    <header class="dash-header">
      <h2><i class="fa-solid fa-tv" style="color:var(--primary)"></i> Don Streaming IPTV</h2>
      <div>
        <span id="lblUser" style="color:#38bdf8; font-size:12px; margin-right:15px; font-weight:bold;"></span>
        <button class="btn-back" onclick="cerrarSesion()">Cerrar Sesión</button>
      </div>
    </header>

    <div class="grid-smarters">
      <div class="tile-card tile-live" onclick="abrirSeccion('live')">
        <i class="fa-solid fa-tv"></i>
        <h2>TV EN VIVO</h2>
        <p id="countLive">0 Canales</p>
      </div>
      <div class="tile-card tile-movies" onclick="abrirSeccion('movies')">
        <i class="fa-solid fa-film"></i>
        <h2>PELÍCULAS</h2>
        <p id="countMovies">0 Títulos</p>
      </div>
      <div class="tile-card tile-series" onclick="abrirSeccion('series')">
        <i class="fa-solid fa-clapperboard"></i>
        <h2>SERIES</h2>
        <p id="countSeries">0 Series</p>
      </div>
    </div>
  </div>

  <!-- REPRODUCTOR WEB -->
  <div id="playerScreen" class="player-view hidden">
    <div class="player-nav">
      <h3 id="playerSectionTitle">📺 Contenido</h3>
      <button class="btn-back" onclick="volverAlDash()">⬅️ Volver</button>
    </div>
    <div class="content-body">
      <aside class="sidebar-categories">
        <input type="text" id="searchBox" class="search-box" placeholder="🔍 Buscar..." oninput="filtrarContenido()">
        <div id="contentList" class="list-container"></div>
      </aside>
      <main class="video-area">
        <video id="mainVideo" controls autoplay playsinline></video>
      </main>
    </div>
  </div>

  <script>
    let activeMethod = 'xtream';
    let globalData = { live: [], movies: [], series: [] };
    let currentMode = 'live';
    let hlsEngine = null;

    window.onload = function() {
      let mac = localStorage.getItem('ds_mac_address');
      if (!mac) {
        mac = 'DS:' + Array.from({length: 5}, () => Math.floor(Math.random()*256).toString(16).padStart(2, '0').toUpperCase()).join(':');
        localStorage.setItem('ds_mac_address', mac);
      }
      document.getElementById('displayMac').innerText = mac;
    };

    function switchTab(m) {
      activeMethod = m;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('formXtream').classList.add('hidden');
      document.getElementById('formM3u').classList.add('hidden');
      document.getElementById('formMac').classList.add('hidden');

      if (m === 'xtream') {
        document.getElementById('tabXtream').classList.add('active');
        document.getElementById('formXtream').classList.remove('hidden');
      } else if (m === 'm3u') {
        document.getElementById('tabM3u').classList.add('active');
        document.getElementById('formM3u').classList.remove('hidden');
      } else if (m === 'mac') {
        document.getElementById('tabMac').classList.add('active');
        document.getElementById('formMac').classList.remove('hidden');
      }
    }

    function copiarMac() {
      navigator.clipboard.writeText(document.getElementById('displayMac').innerText);
      mostrarMsg('📋 Dirección MAC copiada.', 'success');
    }

    // Petición multicanal con fallback de Proxies para saltar bloqueos CORS/HTTP
    async function solicitarURL(targetUrl) {
      const proxies = [
        url => url, // Directo si el panel soporta HTTPS
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
      ];

      for (let proxyFn of proxies) {
        try {
          let res = await fetch(proxyFn(targetUrl));
          if (res.ok) {
            let text = await res.text();
            if (text) return text;
          }
        } catch (e) {}
      }
      throw new Error('No se pudo establecer conexión con el servidor.');
    }

    async function conectarServidor() {
      if (activeMethod === 'mac') {
        const name = document.getElementById('clientName').value.trim();
        if (!name) return mostrarMsg('Ingresa tu nombre.', 'error');
        return mostrarMsg(`✅ Activación solicitada para MAC: ${document.getElementById('displayMac').innerText}`, 'success');
      }

      if (activeMethod === 'xtream') {
        let host = document.getElementById('xtreamHost').value.trim();
        const user = document.getElementById('xtreamUser').value.trim();
        const pass = document.getElementById('xtreamPass').value.trim();

        if (!host || !user || !pass) return mostrarMsg('Ingresa Servidor, Usuario y Contraseña.', 'error');

        if (!host.startsWith('http://') && !host.startsWith('https://')) host = 'http://' + host;
        if (host.endsWith('/')) host = host.slice(0, -1);

        mostrarMsg('⏳ Autenticando con el panel IPTV...', 'success');

        const apiUrl = `${host}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;

        try {
          const rawResponse = await solicitarURL(apiUrl);
          const data = JSON.parse(rawResponse);

          if (Array.isArray(data) && data.length > 0) {
            globalData.live = data.map(item => ({
              name: item.name,
              url: `${host}/live/${user}/${pass}/${item.stream_id}.m3u8`
            }));

            document.getElementById('countLive').innerText = `${globalData.live.length} Canales`;
            document.getElementById('countMovies').innerText = `0 Películas`;
            document.getElementById('countSeries').innerText = `0 Series`;
            document.getElementById('lblUser').innerText = `Usuario: ${user}`;

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashScreen').classList.remove('hidden');
            return;
          } else {
            mostrarMsg('❌ Usuario o clave incorrectos, o usuario vencido.', 'error');
          }
        } catch (e) {
          mostrarMsg('❌ Error al conectar con el servidor Xtream Codes. Revisa la URL.', 'error');
        }
      }

      if (activeMethod === 'm3u') {
        const url = document.getElementById('m3uUrl').value.trim();
        if (!url) return mostrarMsg('Ingresa la URL de la lista M3U.', 'error');

        mostrarMsg('⏳ Descargando y procesando la lista...', 'success');

        try {
          const rawM3u = await solicitarURL(url);
          const lines = rawM3u.split('\n');
          let live = [], movies = [], series = [];
          let cur = null;

          for (let line of lines) {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
              const nameMatch = line.match(/,(.+)$/);
              cur = { name: nameMatch ? nameMatch[1].trim() : 'Canal sin nombre' };
            } else if (line.startsWith('http') && cur) {
              cur.url = line;
              if (line.endsWith('.mp4') || line.endsWith('.mkv')) movies.push(cur);
              else live.push(cur);
              cur = null;
            }
          }

          globalData = { live, movies, series };
          document.getElementById('countLive').innerText = `${live.length} Canales`;
          document.getElementById('countMovies').innerText = `${movies.length} Películas`;
          document.getElementById('countSeries').innerText = `${series.length} Series`;
          document.getElementById('lblUser').innerText = `Lista M3U Cargada`;

          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('dashScreen').classList.remove('hidden');
        } catch (e) {
          mostrarMsg('❌ No se pudo descargar la lista M3U. Revisa la URL.', 'error');
        }
      }
    }

    function abrirSeccion(m) {
      currentMode = m;
      document.getElementById('dashScreen').classList.add('hidden');
      document.getElementById('playerScreen').classList.remove('hidden');
      renderLista(globalData[m]);
    }

    function renderLista(arr) {
      const c = document.getElementById('contentList');
      c.innerHTML = '';
      if (!arr || arr.length === 0) { c.innerHTML = '<p style="padding:15px; font-size:12px; color:#94a3b8;">Sin contenido.</p>'; return; }

      arr.slice(0, 300).forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `<span class="item-title">${item.name}</span>`;
        div.onclick = () => reproducir(item, div);
        c.appendChild(div);
      });
    }

    function reproducir(item, el) {
      document.querySelectorAll('.item-card').forEach(e => e.classList.remove('active'));
      if (el) el.classList.add('active');

      const v = document.getElementById('mainVideo');
      if (hlsEngine) hlsEngine.destroy();

      const proxiedUrl = `https://corsproxy.io/?${encodeURIComponent(item.url)}`;

      if (item.url.includes('.m3u8') && Hls.isSupported()) {
        hlsEngine = new Hls({ enableWorker: true });
        hlsEngine.loadSource(proxiedUrl);
        hlsEngine.attachMedia(v);
        hlsEngine.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
      } else {
        v.src = proxiedUrl;
        v.play().catch(() => {});
      }
    }

    function volverAlDash() {
      if (hlsEngine) hlsEngine.destroy();
      document.getElementById('playerScreen').classList.add('hidden');
      document.getElementById('dashScreen').classList.remove('hidden');
    }

    function cerrarSesion() {
      document.getElementById('dashScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    function filtrarContenido() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      renderLista(globalData[currentMode].filter(i => i.name.toLowerCase().includes(q)));
    }

    function mostrarMsg(txt, t) {
      const b = document.getElementById('statusMsg');
      b.innerText = txt;
      b.className = `status-box ${t === 'success' ? 'status-success' : 'status-error'}`;
      b.classList.remove('hidden');
    }
  </script>
</body>
</html>
