<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Streaming Player</title>

  <!-- HLS.js para reproducción de video streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; overflow-x: hidden; }
    .hidden { display: none !important; }

    /* LAYOUT LOGIN */
    .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%); }
    .login-card { background: #151c2c; border: 1px solid #2a354c; border-radius: 16px; padding: 32px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    
    .logo-box { margin-bottom: 24px; min-height: 60px; display: flex; justify-content: center; align-items: center; }
    .logo-box img { max-height: 70px; max-width: 100%; object-fit: contain; }
    .logo-box h2 { font-size: 24px; color: #3b82f6; font-weight: 800; letter-spacing: 1.5px; }

    .input-group { text-align: left; margin-bottom: 16px; }
    .input-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; }
    .input-group input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #2a354c; background: #0b0f19; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .input-group input:focus { border-color: #3b82f6; }

    .btn-submit { width: 100%; padding: 14px; background: #2563eb; border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn-submit:hover { background: #1d4ed8; }

    .alert { margin-top: 18px; padding: 12px; border-radius: 8px; font-size: 12px; font-weight: 600; text-align: center; word-break: break-word; }
    .alert-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid #ef4444; }
    .alert-info { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid #3b82f6; }

    /* LAYOUT DASHBOARD & CARPETAS */
    .top-bar { background: #151c2c; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a354c; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; padding: 30px; }
    .card-tile { background: #151c2c; border-radius: 14px; padding: 30px; text-align: center; cursor: pointer; border: 1px solid #2a354c; transition: all 0.2s; }
    .card-tile:hover { border-color: #3b82f6; transform: translateY(-3px); background: #1e293b; }
    .card-tile i { font-size: 42px; margin-bottom: 12px; color: #3b82f6; }

    .folders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; padding: 24px; }
    .folder-card { background: #151c2c; padding: 16px; border-radius: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid #2a354c; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    .folder-card:hover { background: #2563eb; border-color: #60a5fa; }

    /* LAYOUT REPRODUCTOR */
    .player-container { display: flex; height: calc(100vh - 65px); }
    .channel-list { width: 340px; background: #151c2c; padding: 12px; overflow-y: auto; border-right: 1px solid #2a354c; }
    .channel-item { padding: 12px 14px; background: #0b0f19; margin-bottom: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; }
    .channel-item:hover, .channel-item.active { background: #2563eb; border-color: #60a5fa; }
    .video-view { flex: 1; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <!-- PANTALLA LOGIN -->
  <div id="screenLogin" class="login-wrapper">
    <div class="login-card">
      <div class="logo-box" id="brandingHeader">
        <h2>DON STREAMING</h2>
      </div>

      <div class="input-group">
        <label>URL / SERVIDOR DNS</label>
        <input type="text" id="inputHost" value="http://zona593latin.top">
      </div>
      <div class="input-group">
        <label>USUARIO</label>
        <input type="text" id="inputUser" value="MAUROIPTV">
      </div>
      <div class="input-group">
        <label>CONTRASEÑA</label>
        <input type="password" id="inputPass" value="MAURO1216">
      </div>

      <button id="btnAction" class="btn-submit" onclick="iniciarConexionDirecta()">🚀 INGRESAR</button>
      <div id="statusAlert" class="alert hidden"></div>
    </div>
  </div>

  <!-- PANTALLA DASHBOARD -->
  <div id="screenDash" class="hidden">
    <div class="top-bar">
      <div class="logo-box" style="margin:0; min-height:auto;"><h2>DON STREAMING</h2></div>
      <button onclick="cerrarSesion()" style="background:#ef4444; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold;">Cerrar Sesión</button>
    </div>
    <div class="grid-container">
      <div class="card-tile" onclick="mostrarCarpetas()">
        <i class="fa-solid fa-tv"></i>
        <h3>CANALES EN VIVO</h3>
        <p id="txtTotalCarpetas" style="margin-top:8px; color:#94a3b8; font-size:13px;">Cargando categorías...</p>
      </div>
    </div>
  </div>

  <!-- PANTALLA CARPETAS / CATEGORÍAS -->
  <div id="screenFolders" class="hidden">
    <div class="top-bar">
      <button onclick="irA('screenDash')" style="background:#2a354c; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold;">⬅ Inicio</button>
      <h4>CATEGORÍAS DE TELEVISIÓN</h4>
    </div>
    <div id="foldersBox" class="folders-grid"></div>
  </div>

  <!-- PANTALLA REPRODUCTOR -->
  <div id="screenPlayer" class="hidden">
    <div class="top-bar">
      <button onclick="irA('screenFolders')" style="background:#2a354c; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold;">⬅ Categorías</button>
      <span id="currentCatTitle" style="color:#60a5fa; font-weight:bold;"></span>
    </div>
    <div class="player-container">
      <div class="channel-list" id="channelsBox"></div>
      <div class="video-view">
        <video id="mainVideo" controls autoplay style="width:100%; height:100%;"></video>
      </div>
    </div>
  </div>

  <script>
    let session = { host: '', user: '', pass: '' };
    let appData = { categories: [], channels: [] };
    let playerInstance = null;

    function mostrarAlerta(msg, type) {
      let box = document.getElementById('statusAlert');
      box.innerText = msg;
      box.className = `alert ${type === 'info' ? 'alert-info' : 'alert-danger'}`;
      box.classList.remove('hidden');
    }

    async function apiFetch(url) {
      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(url)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
      ];

      for (let p of proxies) {
        try {
          let res = await fetch(p);
          if (res.ok) {
            let json = await res.json();
            if (json) return json;
          }
        } catch(e){}
      }
      throw new Error("No se logró conexión con el servidor.");
    }

    async function iniciarConexionDirecta() {
      let host = document.getElementById('inputHost').value.trim();
      let user = document.getElementById('inputUser').value.trim();
      let pass = document.getElementById('inputPass').value.trim();

      if (!host || !user || !pass) {
        return mostrarAlerta('Completa todos los campos para ingresar.', 'err');
      }

      while (host.endsWith('/')) host = host.slice(0, -1);
      if (!host.startsWith('http://') && !host.startsWith('https://')) host = 'http://' + host;

      session = { host, user, pass };

      try {
        mostrarAlerta('⏳ Validando credenciales con el servidor...', 'info');

        // Petición ligera de autenticación Xtream
        let authUrl = `${host}/player_api.php?username=${user}&password=${pass}`;
        let authData = await apiFetch(authUrl);

        if (!authData || (authData.user_info && authData.user_info.auth === 0)) {
          return mostrarAlerta('❌ Usuario o contraseña incorrectos.', 'err');
        }

        mostrarAlerta('⏳ Cargando categorías...', 'info');
        let catUrl = `${host}/player_api.php?username=${user}&password=${pass}&action=get_live_categories`;
        appData.categories = await apiFetch(catUrl);

        mostrarAlerta('⏳ Cargando lista de canales...', 'info');
        let chanUrl = `${host}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;
        appData.channels = await apiFetch(chanUrl);

        document.getElementById('txtTotalCarpetas').innerText = `${appData.categories.length} Categorías disponibles`;
        
        irA('screenDash');

      } catch (err) {
        mostrarAlerta('❌ Error de conexión CORS/HTTPS. Asegúrate de que las credenciales coincidan o intenta ingresar de nuevo.', 'err');
      }
    }

    function mostrarCarpetas() {
      irA('screenFolders');
      let box = document.getElementById('foldersBox');
      box.innerHTML = '';

      if (!appData.categories || appData.categories.length === 0) {
        box.innerHTML = '<p style="padding:20px; color:#fca5a5;">No hay categorías disponibles.</p>';
        return;
      }

      appData.categories.forEach(cat => {
        let count = appData.channels.filter(c => String(c.category_id) === String(cat.category_id)).length;
        if (count > 0) {
          let item = document.createElement('div');
          item.className = 'folder-card';
          item.innerHTML = `<i class="fa-solid fa-folder" style="color:#3b82f6; font-size:18px;"></i> <span>${cat.category_name} (${count})</span>`;
          item.onclick = () => abrirListaCanales(cat.category_id, cat.category_name);
          box.appendChild(item);
        }
      });
    }

    function abrirListaCanales(catId, catName) {
      document.getElementById('currentCatTitle').innerText = catName;
      irA('screenPlayer');

      let filtered = appData.channels.filter(c => String(c.category_id) === String(catId));
      let box = document.getElementById('channelsBox');
      box.innerHTML = '';

      filtered.forEach(ch => {
        let streamUrl = `${session.host}/live/${session.user}/${session.pass}/${ch.stream_id}.m3u8`;
        let btn = document.createElement('div');
        btn.className = 'channel-item';
        btn.innerHTML = `<i class="fa-solid fa-play-circle" style="color:#3b82f6;"></i> <span>${ch.name}</span>`;
        btn.onclick = () => reproducir(streamUrl, btn);
        box.appendChild(btn);
      });
    }

    function reproducir(streamUrl, element) {
      document.querySelectorAll('.channel-item').forEach(e => e.classList.remove('active'));
      if (element) element.classList.add('active');

      let video = document.getElementById('mainVideo');

      // Usar proxy CORS para la transmisión del stream si es necesario
      let finalStream = `https://corsproxy.io/?${encodeURIComponent(streamUrl)}`;

      if (playerInstance) playerInstance.destroy();

      if (Hls.isSupported()) {
        playerInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        playerInstance.loadSource(finalStream);
        playerInstance.attachMedia(video);
        playerInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = finalStream;
        video.play().catch(() => {});
      }
    }

    function irA(screenId) {
      document.getElementById('screenLogin').classList.add('hidden');
      document.getElementById('screenDash').classList.add('hidden');
      document.getElementById('screenFolders').classList.add('hidden');
      document.getElementById('screenPlayer').classList.add('hidden');
      document.getElementById(screenId).classList.remove('hidden');
    }

    function cerrarSesion() {
      if (playerInstance) playerInstance.destroy();
      irA('screenLogin');
    }
  </script>
</body>
</html>
