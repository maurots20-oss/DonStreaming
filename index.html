<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Streaming Player</title>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #080c14; color: #ffffff; min-height: 100vh; }
    .hidden { display: none !important; }

    /* CONTENEDOR LOGIN */
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: radial-gradient(circle, #1a2332 0%, #080c14 100%); padding: 20px; }
    .card-login { background: #111827; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    
    .logo-area { margin-bottom: 20px; min-height: 50px; display: flex; justify-content: center; align-items: center; }
    .logo-area img { max-height: 60px; max-width: 100%; object-fit: contain; }
    .logo-area span { font-size: 24px; font-weight: 800; color: #3b82f6; letter-spacing: 1px; }

    .tabs { display: flex; background: #0b0f19; padding: 4px; border-radius: 10px; margin-bottom: 20px; gap: 4px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; font-weight: 700; font-size: 11px; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    .input-field { text-align: left; margin-bottom: 12px; }
    .input-field label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: 700; text-transform: uppercase; }
    .input-field input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #0b0f19; color: #fff; font-size: 13px; outline: none; }

    .btn-main { width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; }
    .btn-main:hover { background: #1d4ed8; }

    .msg-box { margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
    .msg-err { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .msg-ok { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }

    /* DASHBOARD */
    .header { background: #0f172a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px; }
    .tile { background: #1e293b; border-radius: 16px; padding: 30px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
    .tile:hover { transform: translateY(-3px); border-color: #3b82f6; }
    .tile i { font-size: 40px; margin-bottom: 10px; color: #3b82f6; }

    /* CARPETAS Y REPRODUCTOR */
    .view-container { padding: 20px; }
    .folders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 15px; }
    .folder-item { background: #1e293b; padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
    .folder-item:hover { background: #2563eb; }

    .player-layout { display: flex; height: calc(100vh - 65px); }
    .sidebar { width: 300px; background: #0f172a; padding: 10px; overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.1); }
    .chan-item { padding: 10px; background: rgba(255,255,255,0.02); margin-bottom: 5px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .chan-item:hover, .chan-item.active { background: #2563eb; }
    .screen { flex: 1; background: #000; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginWin" class="login-container">
    <div class="card-login">
      <div class="logo-area" id="logoBox"><span>DON STREAMING</span></div>

      <div class="tabs">
        <button id="tbX" class="tab-btn active" onclick="setTab('xtream')">🔑 Xtream</button>
        <button id="tbM" class="tab-btn" onclick="setTab('m3u')">🏷️ M3U Directo</button>
        <button id="tbL" class="tab-btn" onclick="setTab('logo')">🖼️ Subir Logo</button>
      </div>

      <div id="fX">
        <div class="input-field"><label>DNS / URL Servidor</label><input type="text" id="host" placeholder="http://servidor.com:8080"></div>
        <div class="input-field"><label>Usuario</label><input type="text" id="user" placeholder="Usuario"></div>
        <div class="input-field"><label>Contraseña</label><input type="password" id="pass" placeholder="••••••••"></div>
      </div>

      <div id="fM" class="hidden">
        <div class="input-field"><label>URL Lista M3U</label><input type="text" id="m3u" placeholder="http://servidor.com/get.php?username=..."></div>
      </div>

      <div id="fL" class="hidden">
        <div class="input-field"><label>Seleccionar Imagen Logo</label><input type="file" id="logoFile" accept="image/*" onchange="guardarLogo(event)"></div>
      </div>

      <button id="btnGo" class="btn-main" onclick="conectar()">🚀 CARGAR CANALES</button>
      <div id="status" class="msg-box hidden"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashWin" class="hidden">
    <div class="header">
      <div class="logo-area" style="margin:0; min-height:auto;"><span>DON STREAMING</span></div>
      <button onclick="salir()" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Salir</button>
    </div>
    <div class="grid-dashboard">
      <div class="tile" onclick="abrirSeccion('live')">
        <i class="fa-solid fa-tv"></i>
        <h3>TV EN VIVO</h3>
        <p id="cLive">0 Carpetas</p>
      </div>
      <div class="tile" onclick="abrirSeccion('movie')">
        <i class="fa-solid fa-film"></i>
        <h3>PELÍCULAS</h3>
        <p id="cMovie">0 Carpetas</p>
      </div>
    </div>
  </div>

  <!-- VISTA CARPETAS -->
  <div id="foldWin" class="hidden">
    <div class="header">
      <button onclick="irDash()" style="background:#1e293b; color:#fff; border:1px solid #fff; padding:6px 12px; border-radius:6px; cursor:pointer;">Volver</button>
      <h4 id="secTitle">CARPETAS</h4>
    </div>
    <div class="view-container">
      <div id="foldGrid" class="folders-grid"></div>
    </div>
  </div>

  <!-- REPRODUCTOR -->
  <div id="playWin" class="hidden">
    <div class="header">
      <button onclick="irFold()" style="background:#1e293b; color:#fff; border:1px solid #fff; padding:6px 12px; border-radius:6px; cursor:pointer;">Volver a Carpetas</button>
      <span id="catNameDisplay" style="color:#60a5fa; font-weight:bold;"></span>
    </div>
    <div class="player-layout">
      <div class="sidebar" id="chanList"></div>
      <div class="screen"><video id="vPlayer" controls autoplay></video></div>
    </div>
  </div>

  <script>
    let mode = 'xtream';
    let store = { liveCats: [], liveStreams: [], vodCats: [], vodStreams: [] };
    let selCat = null;
    let currentSec = 'live';
    let hls = null;

    window.onload = () => {
      let l = localStorage.getItem('app_logo');
      if (l) setLogoUI(l);
    };

    function setLogoUI(url) {
      document.querySelectorAll('.logo-area').forEach(e => {
        e.innerHTML = `<img src="${url}" alt="Logo">`;
      });
    }

    function guardarLogo(e) {
      let file = e.target.files[0];
      if (file) {
        let r = new FileReader();
        r.onload = (evt) => {
          localStorage.setItem('app_logo', evt.target.result);
          setLogoUI(evt.target.result);
          showMsg('✅ Logo actualizado correctamente.', 'ok');
        };
        r.readAsDataURL(file);
      }
    }

    function setTab(t) {
      mode = t;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('fX').classList.add('hidden');
      document.getElementById('fM').classList.add('hidden');
      document.getElementById('fL').classList.add('hidden');
      document.getElementById('btnGo').classList.remove('hidden');

      if (t === 'xtream') {
        document.getElementById('tbX').classList.add('active');
        document.getElementById('fX').classList.remove('hidden');
      } else if (t === 'm3u') {
        document.getElementById('tbM').classList.add('active');
        document.getElementById('fM').classList.remove('hidden');
      } else {
        document.getElementById('tbL').classList.add('active');
        document.getElementById('fL').classList.remove('hidden');
        document.getElementById('btnGo').classList.add('hidden');
      }
    }

    async function reqProxy(url) {
      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(url)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
      ];
      for (let p of proxies) {
        try {
          let res = await fetch(p);
          if (res.ok) return await res.text();
        } catch(e) {}
      }
      throw new Error('Error al conectar');
    }

    async function conectar() {
      showMsg('⏳ Descargando y organizando lista...', 'ok');

      if (mode === 'xtream') {
        let h = document.getElementById('host').value.trim();
        let u = document.getElementById('user').value.trim();
        let p = document.getElementById('pass').value.trim();

        if (!h || !u || !p) return showMsg('Ingresa Servidor, Usuario y Clave', 'err');
        if (!h.startsWith('http')) h = 'http://' + h;

        try {
          let cData = await reqProxy(`${h}/player_api.php?username=${u}&password=${p}&action=get_live_categories`);
          let sData = await reqProxy(`${h}/player_api.php?username=${u}&password=${p}&action=get_live_streams`);

          store.liveCats = JSON.parse(cData);
          let st = JSON.parse(sData);

          store.liveStreams = st.map(x => ({
            id: x.stream_id,
            cid: x.category_id,
            name: x.name,
            url: `${h}/live/${u}/${p}/${x.stream_id}.m3u8`
          }));

          document.getElementById('cLive').innerText = `${store.liveCats.length} Carpetas`;
          document.getElementById('loginWin').classList.add('hidden');
          document.getElementById('dashWin').classList.remove('hidden');
        } catch(e) {
          showMsg('❌ Error de conexión con el panel Xtream.', 'err');
        }
      } else if (mode === 'm3u') {
        let url = document.getElementById('m3u').value.trim();
        if (!url) return showMsg('Ingresa la URL M3U', 'err');

        try {
          let txt = await reqProxy(url);
          let lines = txt.split('\n');
          let catsMap = {};
          let streams = [];
          let curCat = 'GENERAL';
          let curName = '';

          lines.forEach(l => {
            l = l.trim();
            if (l.startsWith('#EXTINF:')) {
              let g = l.match(/group-title="([^"]+)"/);
              curCat = g ? g[1].toUpperCase() : 'GENERAL';
              let n = l.match(/,(.+)$/);
              curName = n ? n[1].trim() : 'Canal';
              catsMap[curCat] = { category_id: curCat, category_name: curCat };
            } else if (l.startsWith('http')) {
              streams.push({ id: Math.random(), cid: curCat, name: curName, url: l });
            }
          });

          store.liveCats = Object.values(catsMap);
          store.liveStreams = streams;

          document.getElementById('cLive').innerText = `${store.liveCats.length} Carpetas`;
          document.getElementById('loginWin').classList.add('hidden');
          document.getElementById('dashWin').classList.remove('hidden');
        } catch(e) {
          showMsg('❌ Error al procesar la lista M3U.', 'err');
        }
      }
    }

    function abrirSeccion(s) {
      currentSec = s;
      document.getElementById('dashWin').classList.add('hidden');
      document.getElementById('foldWin').classList.remove('hidden');
      renderCarpetas();
    }

    function renderCarpetas() {
      let grid = document.getElementById('foldGrid');
      grid.innerHTML = '';
      let list = currentSec === 'live' ? store.liveCats : store.vodCats;

      list.forEach(c => {
        let div = document.createElement('div');
        div.className = 'folder-item';
        div.innerHTML = `<i class="fa-solid fa-folder"></i> <span>${c.category_name}</span>`;
        div.onclick = () => abrirReproductor(c.category_id, c.category_name);
        grid.appendChild(div);
      });
    }

    function abrirReproductor(cid, cname) {
      selCat = cid;
      document.getElementById('catNameDisplay').innerText = cname;
      document.getElementById('foldWin').classList.add('hidden');
      document.getElementById('playWin').classList.remove('hidden');

      let items = store.liveStreams.filter(x => String(x.cid) === String(cid));
      let box = document.getElementById('chanList');
      box.innerHTML = '';

      items.forEach(i => {
        let d = document.createElement('div');
        d.className = 'chan-item';
        d.innerText = i.name;
        d.onclick = () => playStream(i.url, d);
        box.appendChild(d);
      });
    }

    function playStream(url, el) {
      document.querySelectorAll('.chan-item').forEach(x => x.classList.remove('active'));
      if(el) el.classList.add('active');

      let v = document.getElementById('vPlayer');
      let pUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;

      if (hls) hls.destroy();

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(pUrl);
        hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
      } else {
        v.src = pUrl;
        v.play().catch(() => {});
      }
    }

    function irDash() {
      document.getElementById('foldWin').classList.add('hidden');
      document.getElementById('dashWin').classList.remove('hidden');
    }

    function irFold() {
      if (hls) hls.destroy();
      document.getElementById('playWin').classList.add('hidden');
      document.getElementById('foldWin').classList.remove('hidden');
    }

    function salir() {
      if (hls) hls.destroy();
      document.getElementById('dashWin').classList.add('hidden');
      document.getElementById('loginWin').classList.remove('hidden');
    }

    function showMsg(txt, type) {
      let s = document.getElementById('status');
      s.innerText = txt;
      s.className = `msg-box ${type === 'ok' ? 'msg-ok' : 'msg-err'}`;
      s.classList.remove('hidden');
    }
  </script>
</body>
</html>
